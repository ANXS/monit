---
monit_email_enable: true
monit_notify_email: "me@localhost"

monit_logfile: "syslog facility log_daemon"
monit_poll_period: 60
monit_poll_start_delay: 120

monit_eventqueue_enable: true
monit_eventqueue_directory: "/var/lib/monit/events"
monit_eventqueue_slots: 100
monit_managed_state_dir: "/var/lib/monit/ansible-managed"

monit_mailformat_from: "monit@{{ inventory_hostname }}"
monit_mailformat_subject: "$SERVICE $EVENT"
monit_mailformat_message: "Monit $ACTION $SERVICE at $DATE on $HOST: $DESCRIPTION."

monit_mailserver_host: "localhost"
monit_mailserver_timeout: 60

monit_port: 3737
monit_address: "localhost"
monit_allow:
  - localhost
monit_ssl: false
monit_cert: "/etc/monit/monit.pem"

monit_monitors_sshd_port: 22
monit_net_retry: 3

monit_default_checks:
  - name: sshd
    matching: "/usr/sbin/sshd"
    service: ssh
    action: restart
    port:
      number: "{{ monit_monitors_sshd_port }}"
      protocol: ssh
  - name: cron
    matching: "/usr/sbin/cron"
    service: cron
    action: restart

monit_ntp_service: auto
monit_ntp_candidates:
  - name: systemd-timesyncd
    unit: systemd-timesyncd.service
    matching: "systemd-timesyncd"
  - name: chrony
    unit: chrony.service
    matching: "chronyd"
  - name: ntp
    unit: ntp.service
    matching: "ntpd"
  - name: ntpsec
    unit: ntpsec.service
    matching: "ntpd"

monit_process_checks: []
monit_network_checks: []
monit_filesystem_checks: []

monit_process_list: []
